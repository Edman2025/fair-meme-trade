name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run-production-e2e:
        description: "Run browser smoke against PROD_BASE_URL"
        required: false
        default: "false"
      run-chain-smoke:
        description: "Run BSC Testnet V3 contract smoke"
        required: false
        default: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Typecheck server
        run: npm run typecheck:server

      - name: Lint
        run: npm run lint

      - name: Check i18n coverage
        run: npm run check:i18n

      - name: Compile contracts
        run: npm run contracts:compile

      - name: Test backend and contracts
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Scan production bundle for placeholders
        run: npm run scan:dist

      - name: Install Playwright Chromium
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run-production-e2e == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Production browser smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run-production-e2e == 'true' }}
        run: npm run e2e:production
        env:
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL || 'https://english.xunlian.co' }}

      - name: Production wallet browser smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run-production-e2e == 'true' }}
        run: npm run e2e:wallet:production
        env:
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL || 'https://english.xunlian.co' }}

      - name: BSC Testnet V3 chain smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run-chain-smoke == 'true' }}
        run: npm run smoke:chain:v3
        env:
          VITE_RPC_URL: ${{ vars.BSC_TESTNET_RPC_URL || 'https://bsc-testnet-rpc.publicnode.com' }}
